# OSV-Scanner configuration.
#
# Entries here suppress a finding from the CI security gate
# (`.github/workflows/security.yml` -> `osv-scanner`). Every entry must state
# what was actually verified and carry an expiry, so an exception cannot
# quietly outlive the reason for it.

[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
ignoreUntil = 2027-01-31
reason = """
brace-expansion DoS (unbounded expansion -> out-of-memory crash).

No fix exists for the affected lines. The advisory publishes a single
range, `introduced=0, fixed=5.0.8` — there is no backport to 1.x or 2.x,
so the two versions present here (1.1.17, 2.1.3) cannot be upgraded to a
patched release within their own major.

Forcing 5.x instead is not viable, and this was established by doing it
rather than reasoning about it. brace-expansion 5 is ESM-only, and
minimatch's CommonJS builds call it as a default export:
  * a `brace-expansion: ^5.0.8` override made `pnpm lint` fail on @soc/web
    with `TypeError: expand is not a function` (minimatch@3.1.5), and
  * `pnpm test:coverage` fail with `TypeError:
    (0 , brace_expansion_1.default) is not a function` (minimatch@9.0.9,
    reached via @vitest/coverage-v8 -> test-exclude -> glob).
The override was reverted for that reason.

Reachability. The vulnerability needs attacker-controlled brace patterns
to be expanded. Neither instance is reachable from the platform's request
path:
  * 1.1.17 — devDependencies only, via eslint -> @eslint/config-array ->
    minimatch@3. Never present in a built image.
  * 2.1.3 — production tree of apps/api and apps/worker, but only via
    @opentelemetry/resource-detector-gcp -> gcp-metadata -> gaxios ->
    rimraf -> glob -> minimatch@9. The glob patterns there are internal
    constants in that dependency chain, not values derived from HTTP
    requests, ingested telemetry, or any other untrusted input this
    platform handles.

Revisit when the ecosystem's minimatch/glob chain ships CJS-compatible
support for brace-expansion 5 (the pending @eslint/js 10.x upgrade is a
likely trigger for the dev-side instance). At that point delete this entry
rather than extending the date.
"""
